# One monthly PR per ecosystem for all minor and patch updates (one CI run, no
# lockfile conflicts between PRs); majors come one PR each. The 7-day cooldown
# skips fresh releases; security updates are not delayed. Merging is manual:
# a merge to main deploys production.
version: 2
updates:
  - package-ecosystem: npm
    target-branch: main
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    target-branch: main
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types:
          - minor
          - patch
