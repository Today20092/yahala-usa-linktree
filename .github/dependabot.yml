version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      routine-npm-updates:
        update-types:
          - minor
          - patch
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      routine-github-actions-updates:
        update-types:
          - minor
          - patch
