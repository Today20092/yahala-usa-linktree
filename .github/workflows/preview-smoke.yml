name: Preview smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Cloudflare preview URL to verify after propagation
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test smoke checker
        run: pnpm run test:preview-smoke

      - name: Build site
        run: pnpm run build

      - name: Verify production assets
        run: pnpm run smoke:preview dist

      - name: Verify deployed preview
        if: github.event_name == 'workflow_dispatch' && inputs.preview_url != ''
        run: pnpm run smoke:preview "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
