name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify branch workflow boundaries
        run: pnpm run test:branch-workflow

      - name: Check Astro and TypeScript
        run: pnpm run check

      - name: Validate data
        run: pnpm run validate:data

      - name: Validate UI consistency
        run: pnpm run validate:ui

      - name: Check token contrast in light and dark
        run: pnpm run test:contrast

      - name: Lint accessibility
        run: pnpm run lint:a11y

      - name: Build site
        run: pnpm run build

      - name: Cache accessibility browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-a11y-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install accessibility browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test rendered accessibility
        run: pnpm run test:a11y:full

      - name: Upload accessibility failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-failures
          path: |
            artifacts/a11y-report/
            artifacts/a11y-results/
          if-no-files-found: ignore

      - name: Check speed and accessibility with Lighthouse
        run: pnpm dlx @lhci/cli@0.16.0 autorun

      - name: Run regression tests
        run: |
          pnpm run test:ui-validation
          pnpm run test:base-ui
          pnpm run test:testimonials
          pnpm run test:requests
          pnpm run test:site-navigation
          pnpm run test:accessibility
          pnpm run test:locations
          pnpm run test:youtube-id
          pnpm run test:youtube-catalog
          pnpm run test:video-search
          pnpm run test:preview-smoke
          pnpm run test:reach-chart
          pnpm run test:atlas-polish
          pnpm run test:motion-toggle
          pnpm run test:visited-map
          pnpm run test:story-coverage
          pnpm run test:editorial-motion
          pnpm run test:video-recency
          pnpm run test:branded-document
          pnpm run test:dependabot

      - name: Verify production assets
        run: pnpm run smoke:preview dist
