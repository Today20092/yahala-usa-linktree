name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify branch workflow boundaries
        run: npm run test:branch-workflow

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Validate data
        run: npm run validate:data

      - name: Validate UI consistency
        run: npm run validate:ui

      - name: Lint accessibility
        run: npm run lint:a11y

      - name: Build site
        run: npm run build

      - name: Cache accessibility browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-a11y-${{ hashFiles('package-lock.json') }}

      - name: Install accessibility browser
        run: npx playwright install --with-deps chromium

      - name: Test rendered accessibility
        run: npm run test:a11y:full

      - name: Upload accessibility failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-failures
          path: |
            artifacts/a11y-report/
            artifacts/a11y-results/
          if-no-files-found: ignore

      - name: Check speed and accessibility with Lighthouse
        run: npx --yes @lhci/cli@0.16.0 autorun

      - name: Run regression tests
        run: |
          npm run test:ui-validation
          npm run test:base-ui
          npm run test:site-navigation
          npm run test:accessibility
          npm run test:locations
          npm run test:youtube-id
          npm run test:youtube-catalog
          npm run test:video-search
          npm run test:preview-smoke
          npm run test:reach-chart
          npm run test:atlas-polish
          npm run test:motion-toggle
          npm run test:visited-map
          npm run test:story-coverage
          npm run test:editorial-motion
          npm run test:video-recency
          npm run test:branded-document
          npm run test:dependabot

      - name: Verify production assets
        run: npm run smoke:preview -- dist
