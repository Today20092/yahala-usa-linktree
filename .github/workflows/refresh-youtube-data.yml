name: Refresh YouTube Data

on:
  schedule:
    - cron: '0 19 * * *'
      timezone: 'America/New_York'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-data-refresh
  cancel-in-progress: false

jobs:
  refresh-youtube-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install yt-dlp
        run: |
          python -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Refresh YouTube catalog
        run: |
          npm run update:youtube -- --refresh-top-videos
          npm run update:visited-videos
          npm run validate:data
      - name: Rebase before committing
        run: git pull --rebase --autostash origin development
      - name: Verify refreshed development source
        run: |
          npm run test:branch-workflow
          npm run validate:data
          npm run validate:ui
          npm run test:locations
          npm run build
          npm run smoke:preview -- dist
      - name: Commit updated YouTube catalog
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: development
          commit_message: Update daily YouTube catalog
          file_pattern: src/data/site.yaml src/data/latest-youtube-videos.json src/data/visited-videos.yaml src/data/youtube-videos.json src/data/geocoded-locations.json
