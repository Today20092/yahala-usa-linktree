name: Refresh YouTube Data

on:
  schedule:
    - cron: '17 7,19 * * *'
      timezone: 'America/New_York'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: youtube-data-refresh
  cancel-in-progress: false

jobs:
  refresh-youtube-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install yt-dlp
        run: |
          python -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Refresh YouTube catalog
        run: |
          npm run update:youtube -- --refresh-top-videos
          npm run update:visited-videos
          npm run validate:data
      - name: Verify refreshed catalog
        run: |
          npm run test:branch-workflow
          npm run validate:data
          npm run validate:ui
          npm run test:locations
          npm run test:youtube-catalog
          npm run test:visited-map
          npm run build
          npm run smoke:preview -- dist
      - name: Open catalog update pull request
        id: catalog-pr
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: automation/youtube-catalog
          commit-message: 'chore: refresh YouTube catalog'
          title: Refresh YouTube catalog
          body: |
            ## Summary

            YouTube refresh → catalog PR → merge to main → production deployment.

            ## Evidence

            Catalog validation, regression checks, build, and asset smoke checks passed before opening this PR. Review the catalog diff and CI before merging.

            ## Merge Danger

            **Door:** two-way

            **Blast Radius:** content

            Merging updates the public story catalog and deploys production.
          add-paths: |
            src/data/site.yaml
            src/data/latest-youtube-videos.json
            src/data/visited-videos.yaml
            src/data/youtube-videos.json
            src/data/geocoded-locations.json
            src/data/business-locations.json
            src/data/business-geocodes.json
      # Explicit dispatches run both PR checks on the catalog head without approval.
      - name: Run checks on the catalog pull request
        if: steps.catalog-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref automation/youtube-catalog
          gh workflow run preview-smoke.yml --ref automation/youtube-catalog
